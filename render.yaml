# Render blueprint for the LeadFlow backend.
#
# Free tier, and its two limits are worth knowing before you rely on it:
#   * the service sleeps after ~15 minutes idle, so the first request after a
#     quiet spell takes 30-60s to cold start;
#   * the filesystem is ephemeral, which is exactly why the forward record
#     lives in Postgres and the daily scan runs in GitHub Actions.
services:
  - type: web
    name: leadflow-api
    runtime: python
    plan: free
    region: singapore          # closest to NSE data sources; any region works
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nifty_swing_bot.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Set these in the Render dashboard, not here. Values committed to a
      # blueprint are values committed to the repo.
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
